name: Android app

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hirebest-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      # Signed Play Store build — runs only once the signing secrets are set in
      # GitHub → Settings → Secrets and variables → Actions (see mobile/README.md).
      - name: Build signed release (AAB + APK)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          cd android && ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: hirebest-release
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
